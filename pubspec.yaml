name: schuetzenfest_app
description: "SchützenRadar App"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.3
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.0
  share_plus: ^7.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ✅ DEV TOOLS
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

  # ✅ nur falls du sie nutzt
  geocoding: ^2.1.0
  image_picker: ^1.0.7
  firebase_storage: ^12.4.10


#--------------------------------------------------
# ✅ APP ICON (ANDROID + IOS)
#--------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icon.png"

  # ✅ WICHTIG für Android (macht Icon groß!)
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/icon.png"


#--------------------------------------------------
# ✅ SPLASH SCREEN
#--------------------------------------------------

flutter_native_splash:
  color: "#2E7D32"
  image: assets/appstore.png

  android_12:
    image: assets/icon.png   # ⚠️ wichtig!
    color: "#2E7D32"


  android: true
  ios: true


#--------------------------------------------------
# ✅ FLUTTER SETTINGS
#--------------------------------------------------
flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/appstore.png