name: schuetzenfest_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.3
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4   # ✅ richtig hier
  flutter_native_splash: ^2.4.0     # ✅ richtig hier
  flutter_lints: ^6.0.0
  geocoding: ^2.1.0
  image_picker: ^1.0.7
  firebase_storage: ^12.4.10


# ✅ ICON KONFIG
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

# ✅ SPLASH SCREEN
flutter_native_splash:
  color: "#2E7D32"
  image: assets/icon.png

  android_12:
    image: assets/icon.png
    color: "#2E7D32"

  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png