<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyApsXWp7Wws8cZKu_ReMMWXZAOecE_QVUw"></script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SchützenRadar App">

  <!-- Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SchützenRadar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>SchützenRadar</title>
  <link rel="manifest" href="manifest.json">

  <!-- ✅ DEFAULT FLUTTER SPLASH -->
  <style>
    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      background-color: #2E7D32;
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .contain {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>

</head>

<body>

  <!-- ✅ DEFAULT FLUTTER LOADER -->
  <picture id="splash">
    <source
      srcset="splash/img/light-1x.png 1x,
              splash/img/light-2x.png 2x,
              splash/img/light-3x.png 3x,
              splash/img/light-4x.png 4x"
      media="(prefers-color-scheme: light)">
    <source
      srcset="splash/img/dark-1x.png 1x,
              splash/img/dark-2x.png 2x,
              splash/img/dark-3x.png 3x,
              splash/img/dark-4x.png 4x"
      media="(prefers-color-scheme: dark)">
    <img class="center contain" src="splash/img/light-1x.png" alt="">
  </picture>

  <!-- ✅ FLUTTER START -->
  <script src="flutter_bootstrap.js" async></script>

</body>

</html>
